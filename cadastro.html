<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js"></script>
</head>
<body>
    
    <div id="main-div">

        <form action="" id="form">

            <input type="text" placeholder="Nome de usuário" id="nome" class="input">
            <input type="email" placeholder="Email" id="email" class="input">
            <input type="password" placeholder="Crie uma senha" id="senha" class="input">
            <input type="password" placeholder="Confirme sua senha" id="conf-senha" class="input">
            <button type="submit" onclick="cadastrar()">Cadastrar</button>


        </form>

    </div>

</body>
</html>
